[package]
name = "owl-logger-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.70.0"
description = "Procedural macros for owl-logger — #[monitor] attribute macro for automatic function instrumentation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xmi-one/owl-logger"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
